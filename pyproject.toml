[project]
name = "endlesswm"
version = "1.0.0"
description = "♾️🌐 EndlessWaferMaps - labeled wafer test streams with controllable data drifts and signal-to-noise ratio."
authors = [
    {name = "Laurenz Farthofer", email = "laurenz@hey.com"}
]
readme = "README.md"
license = "MIT"
keywords = [
    "Python",
    "Data Generation",
    "Data Streams",
    "Continual Learning",
    "Data Structures",
    "Function Composition",
]
requires-python = ">=3.11"


[tool.poetry]
requires-poetry = ">=2.0"
packages = [
    { include = "endlesswm" },
    { include = "experiments", from = "experiments/src"},
]

[tool.poetry.dependencies]
python = "^3.11"
numpy = ">=1.26.4"
polars = "1.30.0"
pandas = ">=2.2.1"
pyarrow = "^18.1.0"
dill = "^0.3.9"
matplotlib = ">=3.8.3"
seaborn = ">=0.13.2"
loguru = ">=0.7.2"
rich = ">=13.7.1"
plotille = "^5.0.0"
skald = "^0.6.3"
scikit-image = "^0.24.0"
torch = "^2.5.1"
torchvision = "^0.20.1"
torchaudio = "^2.5.1"
streamgen = ">=1.2.0"
h5py = "^3.14.0"
orjson = "^3.11.2"
lightning = "^2.5.5"
hydra-core = "^1.3.2"
timm = "^1.0.20"
scikit-learn = "^1.7.2"
torchmetrics = "^1.8.2"
pycocotools = "^2.0.10"
segmentation-models-pytorch = ">=0.5.0"
playwright = "^1.59.0"
einops = "^0.8.2"
faiss-cpu = "^1.14.3"

[tool.poetry.group.dev.dependencies]
ruff = ">=0.15.0"
pre-commit = ">=3.6.2"
poethepoet = ">=0.25.0"
pytest = ">=8.0.2"
coverage = ">=7.4.3"
jupyter = ">=1.0.0"
ipywidgets = ">=8.1.2"
nbconvert = ">=7.16.2"
mkdocs = ">=1.6,<2.0"
mkdocs-material = ">=9.5,<10.0"
mkdocstrings = { extras = ["python"], version = ">=0.28,<1.0" }
itables = ">=2.0.0"
qpsolvers = { extras = [
    "open-source-solvers",
], version = ">=4.3.2" } # explicit install required to solve plotting issue in pytest
ipympl = "^0.9.4"
marimo = "^0.22"
torchinfo = "^1.8.0"

[tool.ruff]
exclude = [
    ".git",
    ".mypy_cache",
    ".ruff_cache",
    ".tox",
    ".venv",
    "__pypackages__",
    "dist",
    "venv",
    "tests",
    "examples"
]
line-length = 140
target-version = "py311"

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"
docstring-code-format = true

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "RUF001",
    "D211",
    "D213",
    "D415",
    "EXE003",
    "TC003",
    "TD002",
    "EXE001",
    "EXE005",
    "PLR0913",
    "UP035",
    "C901"
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.pytest.ini_options]
markers = [
    "slow: longer-running tests skipped by the default Poe test tasks",
    "statistical: empirical sampling and distribution checks",
    "integration: tests that exercise multiple modules through their public interfaces",
    "notebook: tests that import or exercise notebook/explorer code",
    "generation: tests that run dataset generation or generation CLI paths",
    "cli: tests that exercise command-line interfaces",
]

[build-system]
requires = ["poetry-core>=2.0"]
build-backend = "poetry.core.masonry.api"

# Random Range Shape Schedule (Descending)
# ========================================
# Randomly sample shapes within specified ranges, then sort tasks by area.

name: "random_range_descending"
description: "Random shape sampling within width and aspect ratio ranges, sorted by descending area"

strategy: "random_range"

params:
  width_range: [40, 70]
  aspect_ratio: [0.85, 1.15]
  order: "descending"

# MixedWM38 Stem Configuration
# ============================
# Background pipeline tuned to reproduce MixedWM38's near-zero background
# with sparse, independent single-chip "fail" events (salt-and-pepper).
#
# Design choices:
# - Built on `independent` (no spatial correlation, no gradients).
# - `affine` removed: geometric jitter creates moire/blur at the threshold
#   boundary that MixedWM38 does not have.
# - `beta_weibull` + `gaussian_filter` kept but tuned to "barely there" so
#   bulk background stays well below threshold = 0.5 and never crosses it
#   on its own; future variation studies can widen these axes.
# - `impulse_noise` is the dominant background signal, with `high_r`
#   matched to pattern amplitude (~1.0) so post-threshold defect speckle
#   shares value `2` with pattern pixels (no intensity contrast cue).

name: "mixedwm38"
description: "Independent stem tuned for MixedWM38-style salt-and-pepper background with pattern-matched impulse intensity"

nodes:
  - init_output_dictionary
  - beta_weibull
  - gaussian_filter
  - impulse_noise

params:
  beta_weibull:
    alpha_r: [0.1, 0.5]          # Bulk concentrated near 0
    beta_r: [1.5, 2.0]           # Beta skewed toward 0
    weight_beta_r: [0.0, 0.05]   # Very low Beta contribution
    shape_weibull_r: [1.5, 3.0]
    weight_weibull_r: [0.0, 0.05]  # Very low Weibull contribution

  gaussian_filter:
    sigma_r: [0.1, 0.4]          # Mild smoothing, keeps impulses point-like

  impulse_noise:
    fraction_log10_r: [-2.2, -1.0]  # ~0.6%-5% of pixels (MixedWM38-like density)
    low_r: [-0.1, 0.0]           # Tiny negative dip, suppressed by threshold
    high_r: [0.8, 1.2]           # Matches pattern amplitude post-threshold

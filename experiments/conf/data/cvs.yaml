defaults:
  - /data/endlesswm_single_task@data
  - _self_

data:
  name: i-1k
  dataset_seed: 1
  param_fraction: 0.1
  stream:
    train_dataset: experiments/data/generated/coverage_static/${data.name}_f${data.param_fraction}_s${data.dataset_seed}.hdf5

hydra:
